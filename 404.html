<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modak - Redirecting...</title>
    <script>
        // SPA 404 Fallback: Preserve full URL and forward to SPA root
        const target = window.location.pathname + window.location.search + window.location.hash;
        sessionStorage.setItem('modak_redirect_route', target);
        window.location.replace('/');
    </script>
</head>
<body style="font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f8fafc; color: #334155;">
    <p>Loading Modak...</p>
</body>
</html>
