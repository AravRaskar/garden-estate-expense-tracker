<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Steamed Modak warm saffron-gold gradient -->
    <linearGradient id="modakGradLight" x1="16" y1="2" x2="16" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="35%" stop-color="#fef3c7" />
      <stop offset="70%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Dark mode luminous amber-gold gradient -->
    <linearGradient id="modakGradDark" x1="16" y1="2" x2="16" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="40%" stop-color="#fcd34d" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Drop shadow for the dumpling base -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-opacity="0.25" />
    </filter>

    <style>
      .modak-body {
        fill: url(#modakGradLight);
        stroke: #b45309;
        stroke-width: 1.5;
        stroke-linejoin: round;
        filter: url(#shadow);
      }
      .modak-pleat {
        stroke: #d97706;
        stroke-width: 1.3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .modak-crease {
        stroke: #f59e0b;
        stroke-width: 1.1;
        stroke-linecap: round;
        stroke-dasharray: 2 1;
      }
      .modak-tip {
        fill: #dc2626;
        stroke: #b91c1c;
        stroke-width: 0.5;
      }
      .modak-base {
        stroke: #92400e;
        stroke-width: 1.4;
        stroke-linecap: round;
      }

      @media (prefers-color-scheme: dark) {
        .modak-body {
          fill: url(#modakGradDark);
          stroke: #fde68a;
          stroke-width: 1.4;
        }
        .modak-pleat {
          stroke: #92400e;
          stroke-width: 1.3;
        }
        .modak-base {
          stroke: #78350f;
        }
      }
    </style>
  </defs>

  <!-- Modak Silhouette (Plump dumpling base flaring to a graceful pinched crown) -->
  <path class="modak-body" d="M16 3 C16 3 14 6.8 11.8 10.5 C9.2 15 6.5 19 6.5 22.5 C6.5 26.5 10.5 29 16 29 C21.5 29 25.5 26.5 25.5 22.5 C25.5 19 22.8 15 20.2 10.5 C18 6.8 16 3 16 3 Z" />

  <!-- Center Pleat (Primary vertical ridge) -->
  <path class="modak-pleat" d="M16 4.5 V28.8" />

  <!-- Inner Left Pleat (Sweeping gracefully outwards to base) -->
  <path class="modak-pleat" d="M16 5.5 C13.5 10.5 10 16.5 10.8 28.2" />

  <!-- Inner Right Pleat -->
  <path class="modak-pleat" d="M16 5.5 C18.5 10.5 22 16.5 21.2 28.2" />

  <!-- Outer Left Crease -->
  <path class="modak-pleat" d="M13 10 C10.2 14.5 7.8 19.5 8.5 25.5" stroke-opacity="0.8" />

  <!-- Outer Right Crease -->
  <path class="modak-pleat" d="M19 10 C21.8 14.5 24.2 19.5 23.5 25.5" stroke-opacity="0.8" />

  <!-- Base Curve (Subtle pedestal curve) -->
  <path class="modak-base" d="M10 27 C12 28.5 20 28.5 22 27" />

  <!-- Saffron Pinch / Kesar Tip at Apex -->
  <circle class="modak-tip" cx="16" cy="3.5" r="1.2" />
</svg>
